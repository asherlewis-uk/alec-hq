services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alec-hq-app
    working_dir: /workspace
    command: bash -lc "if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then npm ci; fi && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: development
    volumes:
      - .:/workspace
      - alec_hq_node_modules:/workspace/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then((r)=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  alec_hq_node_modules:
